name: PHP console plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, simplexml, zip
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Downloaded source ZIP and release contracts
        run: |
          source_archive="$(mktemp -d)"
          trap 'rm -rf -- "$source_archive"' EXIT
          git archive --format=zip --prefix=mcp_plugin/ --output="$source_archive/source.zip" HEAD
          unzip -q "$source_archive/source.zip" -d "$source_archive/extracted"
          php "$source_archive/extracted/mcp_plugin/tests/run.php"
          php tests/release.php
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MCP_COMPONENT_REPOSITORY || 'joomengine/mcp_component' }}
          ref: ${{ vars.MCP_COMPONENT_REF || 'main' }}
          path: build/component-contract
          persist-credentials: false
      - name: Native Joomla console registration and runtime contracts
        env:
          JOOMLA_ROOT: ${{ runner.temp }}/native-joomla
          MCP_COMPONENT_SOURCE: ${{ github.workspace }}/build/component-contract
        run: |
          bash tests/prepare-native.sh
          php tests/native.php
